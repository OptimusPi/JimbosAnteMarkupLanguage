name: WhimsyDicetrick
author: for pi — Perkeo + Showman + NegativeTag + Oops search party
description: >
  A community search party on Anaglyph for Oops! All 6s. Perkeo and Showman
  early, at least two Negative skip tags, and Oops in the shop. The only score
  is 100 per Oops. A saved seed list is included for convenience; the search
  party is meant for a wide sweep at whatever seeds per second you like.
deck: Anaglyph
stake: White

must:
  - legendaryJoker: Perkeo
    antes: [1, 2, 3, 4]
  - smallBlindTag: NegativeTag
    antes: [2, 3, 4, 5, 6, 7, 8]
    min: 2
  - joker: OopsAll6s
    antes: [2, 3, 4, 5, 6, 7, 8]
    sources:
      shopItems: [2, 3, 4, 5, 6, 7, 8]
  - joker: Showman
    antes: [1, 2, 3, 4]
should:
  # Every Oops! All 6s scores 100, wherever it turns up.
  - joker: OopsAll6s
    antes: [1, 2, 3, 4, 5, 6, 7, 8]
    sources:
      shopItems: [0, 1, 2, 3, 4, 5, 6, 7, 8]
      boosterPacks: [0, 1, 2, 3, 4, 5]
    score: 100
    label: oops_each

