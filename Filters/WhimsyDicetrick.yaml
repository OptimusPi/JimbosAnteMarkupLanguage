name: WhimsyDicetrick
author: for pi — Perkeo + Showman + NegativeTag + Lucky Cat + Ankh + Oops party
description: >
  An Anaglyph hunt for a pile of Oops! All 6s and a Lucky Cat early. Perkeo and
  Showman early, at least two Negative skip tags, and Oops in the post-skip shop
  window. Big scores go to the Oops-in-first-pack / Ankh-in-second-pack duplicate
  path, a NegativeTag with Oops in the same ante's shop, the earliest cats, the
  stacked Oops jackpot, and the lucky hit ladders (money and mult, 8 to 1). The
  seeds below are the hunt list.
deck: Anaglyph
stake: White

must:
  - legendaryJoker: Perkeo
    antes: [1, 2, 3, 4]
  - smallBlindTag: NegativeTag
    antes: [2, 3, 4, 5, 6, 7, 8]
    min: 2
  - joker: OopsAll6s
    antes: [2, 3, 4, 5, 6, 7, 8]
    sources:
      shopItems: [2, 3, 4, 5, 6, 7, 8]
  - joker: Showman
    antes: [1, 2, 3, 4]
  # The star of the party: find the cat early, in a shop or a Buffoon pack.
  - joker: LuckyCat
    antes: [1, 2, 3, 4, 5, 6, 7]
    sources:
      shopItems: [0, 1, 2, 3, 4, 5, 6, 7]
      boosterPacks: [0, 1, 2, 3, 4, 5]

should:
  # The Ankh copy trick: Oops in the first pack, Ankh in the second, same ante.
  # `mode: max` keeps the trick to one score even when several antes offer it.
  - or:
      - and:
          - joker: OopsAll6s
            antes: [1]
            sources: { boosterPacks: [0] }
          - spectralCard: Ankh
            antes: [1]
            sources: { boosterPacks: [1] }
      - and:
          - joker: OopsAll6s
            antes: [2]
            sources: { boosterPacks: [0] }
          - spectralCard: Ankh
            antes: [2]
            sources: { boosterPacks: [1] }
      - and:
          - joker: OopsAll6s
            antes: [3]
            sources: { boosterPacks: [0] }
          - spectralCard: Ankh
            antes: [3]
            sources: { boosterPacks: [1] }
    mode: max
    score: 180
    label: ankh_double_oops

  # Skip into the Negative Tag, then find Oops in that same ante's shop.
  - or:
      - and:
          - smallBlindTag: NegativeTag
            antes: [2]
          - joker: OopsAll6s
            antes: [2]
            sources: { shopItems: [2, 3, 4, 5, 6, 7, 8] }
      - and:
          - smallBlindTag: NegativeTag
            antes: [3]
          - joker: OopsAll6s
            antes: [3]
            sources: { shopItems: [2, 3, 4, 5, 6, 7, 8] }
      - and:
          - smallBlindTag: NegativeTag
            antes: [4]
          - joker: OopsAll6s
            antes: [4]
            sources: { shopItems: [2, 3, 4, 5, 6, 7, 8] }
      - and:
          - smallBlindTag: NegativeTag
            antes: [5]
          - joker: OopsAll6s
            antes: [5]
            sources: { shopItems: [2, 3, 4, 5, 6, 7, 8] }
      - and:
          - smallBlindTag: NegativeTag
            antes: [6]
          - joker: OopsAll6s
            antes: [6]
            sources: { shopItems: [2, 3, 4, 5, 6, 7, 8] }
      - and:
          - smallBlindTag: NegativeTag
            antes: [7]
          - joker: OopsAll6s
            antes: [7]
            sources: { shopItems: [2, 3, 4, 5, 6, 7, 8] }
      - and:
          - smallBlindTag: NegativeTag
            antes: [8]
          - joker: OopsAll6s
            antes: [8]
            sources: { shopItems: [2, 3, 4, 5, 6, 7, 8] }
    mode: max
    score: 140
    label: negative_tag_oops

  # Early kitty = free scaling. Later cats still help, just less.
  - joker: LuckyCat
    antes: [1, 2, 3]
    sources:
      shopItems: [0, 1, 2, 3, 4, 5, 6, 7]
      boosterPacks: [0, 1, 2, 3, 4, 5]
    score: 120
    label: earlycat
  - joker: LuckyCat
    antes: [4]
    sources:
      shopItems: [0, 1, 2, 3, 4, 5, 6, 7]
      boosterPacks: [0, 1, 2, 3, 4, 5]
    score: 60
    label: cat4

  # The jackpot: three Oops in the spots the old dicetricks searches proved.
  - or:
      - joker: OopsAll6s
        antes: [3]
      - joker: OopsAll6s
        antes: [4]
        sources: { shopItems: [2, 3, 4, 5, 6, 7, 8] }
      - joker: OopsAll6s
        antes: [5]
        sources: { shopItems: [0, 1, 2] }
      - joker: OopsAll6s
        antes: [6]
        sources: { shopItems: [0, 1, 2] }
    min: 3
    score: 300
    label: oops_jackpot

  - joker: OopsAll6s
    antes: [5]
    sources:
      shopItems: [2, 3, 4, 5, 6, 7, 8]
    score: 100
  - joker: OopsAll6s
    antes: [3]
    sources:
      shopItems: [0]
    score: 100
  - joker: OopsAll6s
    antes: [6]
    sources:
      shopItems: [0, 1, 2]
    score: 100

  - jokers: [Blueprint, Brainstorm, InvisibleJoker, SockAndBuskin, HangingChad]
    antes: [1, 2, 3, 4]
    sources:
      shopItems: [0, 1]
      boosterPacks: [0, 1]
    score: 29
    max: 1
    label: copy_core

  - luckyMoney: [0]
    score: 28
  - luckyMoney: [1]
    score: 27
  - luckyMoney: [2]
    score: 26
  - luckyMoney: [3]
    score: 25
  - luckyMoney: [4]
    score: 24
  - luckyMoney: [5]
    score: 23
  - luckyMoney: [6]
    score: 22
  - luckyMoney: [7]
    score: 21
  - luckyMult: [0]
    score: 8
  - luckyMult: [1]
    score: 7
  - luckyMult: [2]
    score: 6
  - luckyMult: [3]
    score: 5
  - luckyMult: [4]
    score: 4
  - luckyMult: [5]
    score: 3
  - luckyMult: [6]
    score: 2
  - luckyMult: [7]
    score: 1

