name: WhimsyDicetrick
author: for pi — Perkeo + Showman + NegativeTag + Oops search party
description: >
  A community search party on Anaglyph for Oops! All 6s. Must: Perkeo and
  Showman early, and a Negative Small Blind tag somewhere in antes 2-8.
  Everything else is scored: each ante where a Negative Small Blind tag and
  Oops in the shop line up is worth 100, and so is saving a Negative tag to
  spill it over into the next ante's Oops. Anaglyph's Double Tag after each
  boss doubles the Negative you skip into.
deck: Anaglyph
stake: White

must:
  - smallBlindTag: NegativeTag
    antes: [2, 3, 4, 5, 6]
  - legendaryJoker: Perkeo
    antes: [1, 2, 3, 4, 5, 6]
  - joker: Showman
    antes: [1, 2, 3, 4]
should:
  # The 100 point Negative Oops! All 6s trick: Negative tag and Oops in the same ante
  - score: 100
    label: NegOops2
    and:
      - smallBlindTag: NegativeTag
        ante: 2
      - joker: OopsAll6s
        ante: 2
        sources:
          shopItems: [2, 3, 4, 5]

  - score: 100
    label: NegOops3
    and:
      - smallBlindTag: NegativeTag
        ante: 3
      - joker: OopsAll6s
        ante: 3
        sources:
          shopItems: [2, 3, 4, 5]

  # Spill over: save the Negative tag and use it on the next ante's Oops
  - score: 100
    label: Spill2to3
    and:
      - tag: NegativeTag
        ante: 2
      - joker: OopsAll6s
        ante: 3
        sources:
          shopItems: [0, 1, 2, 3]

  - score: 100
    label: Spill3to4
    and:
      - tag: NegativeTag
        ante: 3
      - joker: OopsAll6s
        ante: 4
        sources:
          shopItems: [0, 1, 2, 3]

  # Every Negative Oops! All 6s, wherever it turns up
  - uncommonJoker: OopsAll6s
    edition: Negative
    antes: [1, 2, 3, 4, 5, 6, 7, 8]
    sources:
      shopItems: [0, 1, 2, 3, 4, 5, 6, 7, 8]
      boosterPacks: [0, 1, 2, 3, 4, 5]
    score: 100
    label: NegativeOops

  # Every other Oops! All 6s
  - uncommonJoker: OopsAll6s
    antes: [1, 2, 3, 4, 5, 6, 7, 8]
    sources:
      shopItems: [0, 1, 2, 3, 4, 5, 6, 7, 8]
      boosterPacks: [0, 1, 2, 3, 4, 5]
    score: 10
    label: OopsAll6s

  - spectralCard: Ankh
    antes: [1, 2, 3, 4]
    score: 10
    max: 1
    label: EarlyAnkh

